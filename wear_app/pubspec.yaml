name: ruya
description: "RUYA Wear OS companion."
publish_to: 'none'

version: 1.1.0+1005

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  wear_plus: ^1.2.3
  shared_preferences: ^2.5.3
  watch_connectivity: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#000000"

  image: assets/icon/ruya_monochrome.png

  android_12:
    color: "#000000"
    image: assets/icon/ruya_monochrome.png

flutter_launcher_icons:
  android: true
  
  adaptive_icon_background: "assets/icon/ruya_background.png"
  adaptive_icon_foreground: "assets/icon/ruya_foreground.png"
  adaptive_icon_monochrome: "assets/icon/ruya_monochrome.png"
  
  image_path: "assets/icon/ruya.png"